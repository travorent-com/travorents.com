<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Failed | TravoRents</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .failure-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2d0a0a 0%, #461414 50%, #5c1b1b 100%);
      padding: 20px;
    }
    
    .failure-card {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideInUp 0.6s ease;
    }
    
    .failure-icon {
      width: 80px;
      height: 80px;
      background: #dc3545;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      font-size: 40px;
      color: white;
      animation: failureBounce 0.6s ease;
    }
    
    .failure-card h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #721c24;
      margin-bottom: 15px;
    }
    
    .failure-card p {
      color: #6c757d;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: #dc3545;
      color: white;
    }
    
    .btn-primary:hover {
      background: #bd2130;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220,53,69,0.4);
    }
    
    .btn-secondary {
      background: #f1f3f5;
      color: #495057;
      border: 1px solid #ced4da;
    }
    
    .btn-secondary:hover {
      background: #e2e6ea;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes failureBounce {
      0%, 100% { transform: scale(0); }
      50% { transform: scale(1.1); }
      80% { transform: scale(0.95); }
    }
  </style>
</head>
<body>

<div class="failure-container">
  <div class="failure-card">
    <div class="failure-icon">
      <i class="fas fa-times"></i>
    </div>
    
    <h1>Payment Failed</h1>
    <p>We could not process your transaction. No money was charged. Please check your payment details or try again.</p>
    
    <a href="index.html" class="btn btn-primary">
      <i class="fas fa-redo"></i> Try Booking Again
    </a>
    
    <a href="tel:+918455065107" class="btn btn-secondary">
      <i class="fas fa-phone-alt"></i> Contact Support
    </a>
  </div>
</div>

</body>
</html>
